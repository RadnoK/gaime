# Stays up while the game process restarts.
# release mode: `/`, `/assets/*` and `/health` come from the published build (atomic, old assets kept),
# live mode:    the public dir is empty, everything is proxied to Vite (including the HMR WebSocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Several game processes (GAIME_PROCESSES with compose.redis.yml; docs/DEPLOYMENT.md "Scaling out"):
# process i listens on 5173 + i, and clients reach the rooms it runs at /p<i>/ (its GAIME_PUBLIC_ADDRESS).
# The page, /gaime/room and Colyseus matchmaking stay on the plain paths, served by process 0.
map $gaime_process $gaime_process_port {
    default "";
    0 5173;  1 5174;  2 5175;  3 5176;  4 5177;  5 5178;  6 5179;  7 5180;
    8 5181;  9 5182; 10 5183; 11 5184; 12 5185; 13 5186; 14 5187; 15 5188;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # Optional password for the whole game: deploy/install.sh --password writes auth/auth.conf + auth/htpasswd.
    include /etc/nginx/auth/*.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    location = /gateway-health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # The operator API is for `gaime` inside the container only.
    location /gaime/admin/ {
        return 404;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html @game;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri @game;
    }
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /health.json @game;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @game;
    }
    location / {
        try_files /__never__ @game;
    }

    # A room connection on process i: /p<i>/<processId>/<roomId>?sessionId=… → port 5173 + i.
    location ~ "^/p(?<gaime_process>[0-9]{1,2})(?<gaime_path>/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/?)$" {
        if ($gaime_process_port = "") { return 404; }
        set $backend http://game:$gaime_process_port;
        proxy_pass $backend$gaime_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @deploying;
    }
    # Nothing else of the other processes is public (their admin API included).
    location ~ "^/p[0-9]{1,2}/" {
        return 404;
    }

    # Fresh Docker DNS answer when Compose replaces the game container.
    resolver 127.0.0.11 valid=1s ipv6=off;
    location @game {
        set $backend http://game:5173;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @deploying;
    }
    location @deploying {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        return 503 '{"ok":false,"deploying":true}';
    }
}
